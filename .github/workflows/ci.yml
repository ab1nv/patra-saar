name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      # Self-contained: no repository secrets required.
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/patrasaar
      JWT_SECRET: ci-only-secret-do-not-use-in-production
      # Empty key runs the app in deterministic offline mode; E2E stubs the LLM stream.
      GROQ_API_KEY: ''
      GROQ_MODEL: qwen/qwen3.8-27b
      NEXT_TELEMETRY_DISABLED: '1'

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: patrasaar
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Dead code (knip)
        run: pnpm knip

      - name: Unit tests
        run: pnpm test:unit

      - name: Seed database
        run: pnpm seed

      - name: Build
        run: pnpm build

      - name: Install Playwright browser
        run: pnpm exec playwright install --with-deps chromium

      - name: E2E tests
        run: pnpm test:e2e
